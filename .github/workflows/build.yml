name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QM2_DATA: ${{ github.workspace }}/smoke-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          if [ "$RUNNER_OS" != "Linux" ]; then pip install -r requirements-desktop.txt; fi

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          else V="$(python -c 'import quillmaster2; print(quillmaster2.__version__)')"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the app
        shell: bash
        run: |
          SEP=":"; ICON=assets/icon.png
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; ICON=assets/icon.ico; fi
          if [ "$RUNNER_OS" = "macOS" ]; then ICON=assets/icon.icns; fi
          pyinstaller --noconfirm --clean --name "Quill Master 2" --windowed --icon "$ICON" \
            --osx-bundle-identifier com.kornerdspider.quillmaster2 \
            --add-data "quillmaster2/static${SEP}quillmaster2/static" \
            --add-data "samples${SEP}samples" \
            --collect-submodules uvicorn --collect-submodules quillmaster2 \
            run.py

      - name: Smoke test (start the built app and ask it for its health)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist/Quill Master 2/Quill Master 2.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then EXE="dist/Quill Master 2.app/Contents/MacOS/Quill Master 2"
          else EXE="dist/Quill Master 2/Quill Master 2"; fi
          "$EXE" --no-browser &
          PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8765/v2/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/v2/health
          curl -sf http://127.0.0.1:8765/ | grep -q "Quill Master"
          curl -sf http://127.0.0.1:8765/static/app.js > /dev/null
          curl -sf -X POST http://127.0.0.1:8765/v2/quit || true
          sleep 2; kill $PID 2>/dev/null || true
          echo "Smoke test passed"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\windows.iss
          Compress-Archive -Path "dist\Quill Master 2" -DestinationPath dist\QuillMaster2-Windows-portable.zip

      - name: Package for Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dmg && cp -R "dist/Quill Master 2.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Quill Master 2" -srcfolder dmg -ov -format UDZO dist/QuillMaster2-Mac.dmg

      - name: Package for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p pkg/QuillMaster2
          cp -r "dist/Quill Master 2" pkg/QuillMaster2/
          cp installer/linux-install.sh pkg/QuillMaster2/install.sh
          cp assets/icon.png pkg/QuillMaster2/icon.png
          chmod +x pkg/QuillMaster2/install.sh
          tar -C pkg -czf dist/QuillMaster2-Linux.tar.gz QuillMaster2

      - uses: actions/upload-artifact@v4
        with:
          name: QuillMaster2-${{ runner.os }}
          path: |
            dist/QuillMaster2-Setup-Windows.exe
            dist/QuillMaster2-Windows-portable.zip
            dist/QuillMaster2-Mac.dmg
            dist/QuillMaster2-Linux.tar.gz
          if-no-files-found: ignore

      # Every successful build of main (or a v* tag) publishes the installers as the
      # release for the version in quillmaster2/__init__.py. GitHub creates the tag.
      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Quill Master ${{ env.APP_VERSION }}
          body: |
            Download the installer for your computer below. Step-by-step install help is in the README:
            https://github.com/kornerdspider/QUILLMASTER-2#install-it-the-easy-way

            - **Windows:** QuillMaster2-Setup-Windows.exe (or the portable zip)
            - **Mac (Apple chip):** QuillMaster2-Mac.dmg
            - **Linux:** QuillMaster2-Linux.tar.gz
          make_latest: true
          files: |
            dist/QuillMaster2-Setup-Windows.exe
            dist/QuillMaster2-Windows-portable.zip
            dist/QuillMaster2-Mac.dmg
            dist/QuillMaster2-Linux.tar.gz
          fail_on_unmatched_files: false
